name: win 2022 bore rdp and Downloads.bat

on:
  workflow_dispatch:

jobs:
  rdp-bore:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Write-Host "Configuring RDP and firewall..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Allow" 2>$null
          netsh advfirewall firewall add rule name="RDP-Allow" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force
          Write-Host "RDP configured."

      - name: Create RDP User
        run: |
          Write-Host "Creating RDP user..."
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }
          Write-Host "RDP user ready."

      - name: Start bore TCP Tunnel and Downloads.bat
        run: |
          $boreZip = "$env:TEMP\bore.zip"
          $boreDir = "$env:ProgramFiles\bore"
          $logFile = "$env:TEMP\bore.log"
          $errFile = "$env:TEMP\bore.err"

          New-Item -ItemType Directory -Path $boreDir -Force | Out-Null

          Write-Host "Downloading bore..."
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*x86_64-pc-windows-msvc.zip" } | Select-Object -First 1
          if (-not $asset) {
              Write-Error "Could not find Windows release asset for bore."
              exit 1
          }

          curl.exe -L --fail --silent --show-error "$($asset.browser_download_url)" -o "$boreZip"
          Expand-Archive -Path $boreZip -DestinationPath $boreDir -Force
          Remove-Item $boreZip -Force

          $boreExe = Get-ChildItem -Path $boreDir -Filter "bore.exe" -Recurse | Select-Object -First 1
          if (-not $boreExe) {
              Write-Error "bore.exe not found after extraction."
              exit 1
          }

          $proc = Start-Process -FilePath $boreExe.FullName `
              -ArgumentList "local", "3389", "--to", "bore.pub" `
              -RedirectStandardOutput $logFile -RedirectStandardError $errFile `
              -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 4

          Write-Host "=== RDP CREDENTIALS ==="
          Write-Host "Username: RDP"
          Write-Host "Password: MR.English2008"
          Write-Host "======================="

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"
          $batRan = $false

          while ($true) {
              if ($proc.HasExited) {
                  Write-Warning "bore exited unexpectedly!"
                  if (Test-Path $logFile) { Get-Content $logFile -Tail 20 }
                  if (Test-Path $errFile) { Get-Content $errFile -Tail 20 }
              }
              else {
                  if (Test-Path $logFile) {
                      $lines = Get-Content $logFile
                      if ($lines) {
                          Write-Host "[$(Get-Date)] Tunnel info:"
                          $lines | Select-Object -Last 5 | ForEach-Object { Write-Host "  $_" }
                      }
                  }
              }

              if (-not $batRan -and (Test-Path $rdpProfile)) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }
                      curl.exe -L --fail --silent --show-error "$downloadUrl" -o "$downloadPath"
                      if (Test-Path $downloadPath) {
                          Write-Host "Downloads.bat copied to $downloadPath"
                          cmd /c "$downloadPath"
                          Write-Host "Downloads.bat executed successfully"
                          $batRan = $true
                      }
                  }
                  catch {
                      Write-Warning "Error with Downloads.bat: $($_.Exception.Message)"
                  }
              }

              Start-Sleep -Seconds 20
          }
