name: win 2022 + tailscale + Downloads.bat script

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Configure Core RDP Settings
        run: |
          Write-Host "Configuring RDP and firewall..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force
          Write-Host "RDP configured."

      - name: Create RDP User with Fixed Password
        run: |
          Write-Host "Creating RDP user..."
          $password = "MR.English2008"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          "RDP_CREDS=User: RDP | Password: $password" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }
          Write-Host "RDP user ready."

      - name: Install Tailscale
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale MSI..."
          curl.exe -L --fail --silent --show-error "$tsUrl" -o "$installerPath"
          if (-not (Test-Path $installerPath)) {
              Write-Error "Failed to download Tailscale MSI"
              exit 1
          }

          Write-Host "Installing Tailscale..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Tailscale installed."

      - name: Establish Tailscale Connection
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              Write-Error "TAILSCALE_AUTHKEY secret is missing or empty!"
              exit 1
          }

          Write-Host "Connecting to Tailscale..."
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$env:TS_AUTHKEY" --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4) 2>$null | Select-Object -First 1
              if (-not $tsIP) {
                  Start-Sleep -Seconds 3
                  $retries++
              }
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          Write-Host "Assigned Tailscale IP: $tsIP"
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Testing port 3389 on $env:TAILSCALE_IP..."
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if (-not $testResult.TcpTestSucceeded) {
              Write-Warning "TCP check on 3389 returned false; continuing to monitor session."
          }
          else {
              Write-Host "TCP connectivity to port 3389 succeeded!"
          }

      - name: Maintain Connection + Watch RDP User
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "$env:RDP_CREDS"
          Write-Host "==================`n"

          $rdpProfile = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $downloadUrl = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $downloadPath = "$startupPath\Downloads.bat"

          while ($true) {
              if (Test-Path $rdpProfile) {
                  try {
                      if (-not (Test-Path $startupPath)) {
                          New-Item -ItemType Directory -Path $startupPath -Force | Out-Null
                      }

                      curl.exe -L --fail --silent --show-error "$downloadUrl" -o "$downloadPath"
                      if (Test-Path $downloadPath) {
                          Write-Host "Downloads.bat copied to $downloadPath"
                          cmd /c "$downloadPath"
                          Write-Host "Downloads.bat executed successfully"
                      }
                      else {
                          Write-Warning "Downloads.bat not downloaded; skipping execution."
                      }
                      break
                  }
                  catch {
                      Write-Warning "Error handling Downloads.bat: $($_.Exception.Message)"
                      break
                  }
              }
              else {
                  Write-Host "[$(Get-Date)] Waiting for RDP profile to be created..."
                  Start-Sleep -Seconds 30
              }
          }

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Address: $env:TAILSCALE_IP | Cancel workflow when done"
              Start-Sleep -Seconds 300
          }
